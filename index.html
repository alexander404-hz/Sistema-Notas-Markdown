<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sistema de Notas Markdown</title>

    <meta
      name="description"
      content="Aplicación de notas en Markdown con operaciones CRUD completas, vista previa en tiempo real y búsqueda, todo persistido en localStorage sin backend."
    />

    <meta
      name="keywords"
      content="Notas, Sistema, Markdown, CRUD, Alexander Hz"
    />

    <meta name="author" content="Alexander Hz." />
    <meta name="robots" content="index, follow" />

    <link
      rel="canonical"
      href="https://alexander404-hz.github.io/Sistema-Notas-Markdown/"
    />

    <!-- Open Graph -->
    <meta
      property="og:url"
      href="https://alexander404-hz.github.io/Sistema-Notas-Markdown/"
    />
    <meta property="og:title" content="Sistema de Notas Markdown" />
    <meta
      property="og:site_name"
      content="Sistema de Notas Markdown Completo"
    />
    <meta
      property="og:description"
      content="Aplicación de notas en Markdown con operaciones CRUD completas, vista previa en tiempo real y búsqueda, todo persistido en localStorage sin backend."
    />
    <meta
      property="og:image"
      content="https://alexander404-hz.github.io/Sistema-Notas-Markdown/assets/img/preview.png"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_SV" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sistema de Notas Markdown Completo" />
    <meta
      name="twitter:description"
      content="Aplicación de notas en Markdown con operaciones CRUD completas, vista previa en tiempo real y búsqueda, todo persistido en localStorage sin backend."
    />
    <meta
      name="twitter:image"
      content="https://alexander404-hz.github.io/Sistema-Notas-Markdown/assets/img/preview.png"
    />

    <!-- Favicon -->
    <link rel="icon" href="favicon.ico" />
    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/icons/favicon-16x16.png"
    />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />

    <!-- fuentes  -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"
      rel="stylesheet"
    />

    <!-- diseño general -->
    <meta name="theme-color" content="#a2791c" />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Sistema de Notas Markdown</h1>
        <p class="app-subtitle">
          Escribe en Markdown, organiza tus ideas y expórtalas cuando quieras.
        </p>
      </header>

      <div class="main-content">
        <aside class="sidebar">
          <div class="sidebar-header">
            <div class="sidebar-title-row">
              <h2>Mis Notas</h2>
              <div class="sidebar-title-actions">
                <button
                  id="new-note-button"
                  class="btn-icon btn-icon-primary"
                  title="Nueva nota"
                  aria-label="Nueva nota"
                >
                  +
                </button>
                <div class="notes-menu">
                  <button
                    id="notes-menu-button"
                    class="btn-icon"
                    title="Más opciones"
                    aria-label="Más opciones"
                    aria-haspopup="true"
                    aria-expanded="false"
                  >
                    ⋮
                  </button>
                  <div
                    id="notes-menu-dropdown"
                    class="notes-menu-dropdown is-hidden"
                    role="menu"
                  >
                    <button
                      id="menu-select-notes"
                      class="notes-menu-item"
                      role="menuitem"
                    >
                      ☑ Seleccionar notas
                    </button>
                    <button
                      id="menu-export-all"
                      class="notes-menu-item"
                      role="menuitem"
                    >
                      ⭳ Exportar todas
                    </button>
                    <button
                      id="menu-import-notes"
                      class="notes-menu-item"
                      role="menuitem"
                    >
                      ⭱ Importar notas
                    </button>
                    <input
                      type="file"
                      id="import-file-input"
                      accept=".json,application/json"
                      class="visually-hidden"
                    />
                    <button
                      id="menu-trash"
                      class="notes-menu-item notes-menu-item-trash"
                      role="menuitem"
                    >
                      <span>🗑 Papelera</span>
                      <span
                        id="trash-count-badge"
                        class="trash-count-badge is-hidden"
                      ></span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
            <div id="bulk-actions-bar" class="bulk-actions-bar is-hidden">
              <div class="bulk-actions-header">
                <span id="selection-count-label">0 notas seleccionadas</span>
                <button
                  id="cancel-selection-button"
                  class="btn-icon"
                  title="Cancelar selección"
                  aria-label="Cancelar selección"
                >
                  ✕
                </button>
              </div>
              <div class="bulk-actions-controls">
                <label class="bulk-select-all">
                  <input
                    type="checkbox"
                    id="select-all-checkbox"
                    aria-label="Seleccionar todas las notas visibles"
                  />
                  <span>Seleccionar todas</span>
                </label>
                <div class="bulk-actions-buttons">
                  <button
                    id="bulk-favorite-button"
                    class="btn-icon"
                    title="Marcar como favoritas"
                    aria-label="Marcar como favoritas"
                    disabled
                  >
                    ★
                  </button>
                  <button
                    id="bulk-unfavorite-button"
                    class="btn-icon"
                    title="Quitar de favoritas"
                    aria-label="Quitar de favoritas"
                    disabled
                  >
                    ☆
                  </button>
                  <button
                    id="bulk-export-button"
                    class="btn-icon"
                    title="Exportar selección"
                    aria-label="Exportar selección"
                    disabled
                  >
                    ⭳
                  </button>
                  <button
                    id="bulk-delete-button"
                    class="btn-icon btn-icon-danger"
                    title="Eliminar selección"
                    aria-label="Eliminar selección"
                    disabled
                  >
                    🗑
                  </button>
                </div>
              </div>
            </div>
            <input
              type="search"
              id="search-input"
              class="search-input"
              placeholder="Buscar notas..."
              aria-label="Buscar notas"
            />
            <div class="filters-bar">
              <span class="filters-label">Filtros</span>
              <button
                id="favorites-toggle-button"
                class="filter-chip"
                aria-pressed="false"
              >
                ☆ Favoritas
              </button>
              <div class="date-filter">
                <button
                  id="date-filter-button"
                  class="filter-chip"
                  aria-haspopup="true"
                  aria-expanded="false"
                  aria-pressed="false"
                >
                  📅 Fecha
                </button>
                <div
                  id="date-filter-dropdown"
                  class="date-filter-dropdown is-hidden"
                  role="menu"
                >
                  <button
                    type="button"
                    class="date-filter-option"
                    data-range="all"
                    role="menuitem"
                  >
                    Todas
                  </button>
                  <button
                    type="button"
                    class="date-filter-option"
                    data-range="today"
                    role="menuitem"
                  >
                    Hoy
                  </button>
                  <button
                    type="button"
                    class="date-filter-option"
                    data-range="week"
                    role="menuitem"
                  >
                    Últimos 7 días
                  </button>
                  <button
                    type="button"
                    class="date-filter-option"
                    data-range="month"
                    role="menuitem"
                  >
                    Este mes
                  </button>
                  <button
                    type="button"
                    class="date-filter-option"
                    data-range="custom"
                    role="menuitem"
                  >
                    Rango personalizado
                  </button>
                  <div
                    id="date-filter-custom"
                    class="date-filter-custom is-hidden"
                  >
                    <label class="date-filter-field">
                      Desde
                      <input type="date" id="date-filter-start" />
                    </label>
                    <label class="date-filter-field">
                      Hasta
                      <input type="date" id="date-filter-end" />
                    </label>
                    <button
                      type="button"
                      id="date-filter-apply"
                      class="date-filter-apply"
                    >
                      Aplicar
                    </button>
                  </div>
                </div>
              </div>
              <div class="sort-filter">
                <button
                  id="sort-filter-button"
                  class="filter-chip"
                  aria-haspopup="true"
                  aria-expanded="false"
                >
                  ⇅ Más recientes
                </button>
                <div
                  id="sort-filter-dropdown"
                  class="sort-filter-dropdown is-hidden"
                  role="menu"
                >
                  <button
                    type="button"
                    class="sort-filter-option is-selected"
                    data-sort="updated-desc"
                    role="menuitem"
                  >
                    Editadas: más recientes primero
                  </button>
                  <button
                    type="button"
                    class="sort-filter-option"
                    data-sort="updated-asc"
                    role="menuitem"
                  >
                    Editadas: más antiguas primero
                  </button>
                  <button
                    type="button"
                    class="sort-filter-option"
                    data-sort="created-desc"
                    role="menuitem"
                  >
                    Creadas: más nuevas primero
                  </button>
                  <button
                    type="button"
                    class="sort-filter-option"
                    data-sort="created-asc"
                    role="menuitem"
                  >
                    Creadas: más antiguas primero
                  </button>
                  <button
                    type="button"
                    class="sort-filter-option"
                    data-sort="title-asc"
                    role="menuitem"
                  >
                    Título: A → Z
                  </button>
                  <button
                    type="button"
                    class="sort-filter-option"
                    data-sort="title-desc"
                    role="menuitem"
                  >
                    Título: Z → A
                  </button>
                </div>
              </div>
            </div>
          </div>
          <div id="note-list" class="note-list"></div>
        </aside>

        <main class="editor-section is-hidden" id="editor-section">
          <div class="editor-header">
            <div class="editor-title-group">
              <h2>Editor</h2>
              <p id="editor-meta" class="editor-meta"></p>
            </div>
            <div class="editor-actions">
              <button id="save-note-button" class="btn btn-success">
                Guardar
              </button>
              <button id="delete-note-button" class="btn btn-danger is-hidden">
                Eliminar
              </button>
            </div>
          </div>
          <textarea
            id="editor-textarea"
            class="editor-textarea"
            placeholder="Escribe tu nota en Markdown aquí..."
          ></textarea>
        </main>

        <section class="preview-section is-hidden" id="preview-section">
          <div class="preview-header">
            <h2>Preview</h2>
          </div>
          <div id="preview-container" class="preview-container"></div>
        </section>
      </div>
    </div>
    <div id="message-container" class="message"></div>
    <div id="confirm-dialog-overlay" class="confirm-dialog-overlay">
      <div
        id="confirm-dialog"
        class="confirm-dialog"
        role="alertdialog"
        aria-modal="true"
        aria-labelledby="confirm-dialog-title"
        aria-describedby="confirm-dialog-message"
      >
        <h3 id="confirm-dialog-title" class="confirm-dialog-title"></h3>
        <p id="confirm-dialog-message" class="confirm-dialog-message"></p>
        <div class="confirm-dialog-actions">
          <button
            type="button"
            id="confirm-dialog-cancel"
            class="btn btn-ghost"
          ></button>
          <button
            type="button"
            id="confirm-dialog-confirm"
            class="btn btn-primary"
          ></button>
        </div>
      </div>
    </div>
    <div id="trash-overlay" class="trash-overlay">
      <div
        id="trash-dialog"
        class="trash-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="trash-dialog-title"
      >
        <div class="trash-dialog-header">
          <h3 id="trash-dialog-title">🗑 Papelera</h3>
          <button
            type="button"
            id="trash-close-button"
            class="btn-icon"
            title="Cerrar"
            aria-label="Cerrar papelera"
          >
            ✕
          </button>
        </div>
        <p class="trash-dialog-hint">
          Las notas eliminadas quedan acá antes de borrarse para siempre.
        </p>
        <div class="trash-dialog-controls">
          <label class="bulk-select-all">
            <input
              type="checkbox"
              id="trash-select-all-checkbox"
              aria-label="Seleccionar todas las notas de la papelera"
            />
            <span>Seleccionar todas</span>
          </label>
          <div class="trash-dialog-actions">
            <button
              type="button"
              id="trash-restore-button"
              class="btn btn-ghost"
              disabled
            >
              ♻ Restaurar
            </button>
            <button
              type="button"
              id="trash-delete-button"
              class="btn btn-danger"
              disabled
            >
              Eliminar definitivamente
            </button>
          </div>
        </div>
        <div id="trash-list" class="trash-list"></div>
        <div class="trash-dialog-footer">
          <button
            type="button"
            id="trash-empty-button"
            class="btn btn-danger-solid"
          >
            Vaciar papelera
          </button>
        </div>
      </div>
    </div>
    <div id="import-overlay" class="trash-overlay">
      <div
        id="import-dialog"
        class="trash-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="import-dialog-title"
      >
        <div class="trash-dialog-header">
          <h3 id="import-dialog-title">⭱ Importar notas</h3>
          <button
            type="button"
            id="import-close-button"
            class="btn-icon"
            title="Cerrar"
            aria-label="Cerrar importación"
          >
            ✕
          </button>
        </div>
        <p id="import-dialog-hint" class="trash-dialog-hint">
          Elegí qué notas del archivo querés importar.
        </p>
        <div class="trash-dialog-controls">
          <label class="bulk-select-all">
            <input
              type="checkbox"
              id="import-select-all-checkbox"
              aria-label="Seleccionar todas las notas a importar"
            />
            <span>Seleccionar todas</span>
          </label>
          <div class="trash-dialog-actions">
            <button
              type="button"
              id="import-confirm-button"
              class="btn btn-primary"
              disabled
            >
              ⭱ Importar seleccionadas
            </button>
          </div>
        </div>
        <div id="import-list" class="trash-list"></div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/markdown-it@14.0.0/dist/markdown-it.min.js"
      integrity="sha384-m4eAATWFHwurgWQTBxFRh5346JXxGTucT+lJH2TcxGrE+vNBENJGasyBNnLc23ft"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/markdown-it-task-lists@2.1.1/dist/markdown-it-task-lists.min.js"
      integrity="sha384-FKY5Inm02LmR+QgGl8g9DxuTQ+UuOo3tWGSVd7ZmWSPl9DyYsmi7kE3tTjC3ZEow"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>
